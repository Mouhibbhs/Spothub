name: spothub
description: A music discovery library with YouTube-backed search and playback.
publish_to: none
version: 1.0.1+6

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.11.1
  file_picker: ^13.1.0
  flutter_riverpod: ^3.4.3
  flutter_local_notifications: ^22.3.2
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  connectivity_plus: ^7.3.2
  go_router: ^18.0.2
  html: ^0.15.7
  just_audio: ^0.10.6
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  sqflite: ^2.4.4+1
  url_launcher: ^6.3.3
  youtube_explode_dart:
    path: third_party/youtube_explode_dart
  youtube_player_iframe: ^6.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.3

flutter:
  default-flavor: official
  uses-material-design: true
  assets:
    - final-icon.png
    - assets/playlist-import-example.csv
