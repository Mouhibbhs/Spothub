name: Android APK release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build and publish APKs
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check release tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          app_version="$(sed -n 's/^version: *//p' pubspec.yaml | cut -d+ -f1)"
          test "v${app_version}" = "${GITHUB_REF_NAME}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match pubspec version ${app_version}."
            exit 1
          }

      - name: Get packages
        run: flutter pub get

      - name: Build official release APK
        run: flutter build apk --release --flavor official -t lib/main.dart

      - name: Build personal release APK
        run: flutter build apk --release --flavor personal -t lib/main_personal.dart

      - name: Name APK assets
        shell: bash
        run: |
          mkdir -p release-assets
          cp build/app/outputs/flutter-apk/app-official-release.apk "release-assets/SpotHub-official-${GITHUB_REF_NAME}.apk"
          cp build/app/outputs/flutter-apk/app-personal-release.apk "release-assets/SpotHub-personal-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: SpotHub ${{ github.ref_name }}
          generate_release_notes: false
          body_path: release-notes/${{ github.ref_name }}.md
          files: release-assets/*.apk
